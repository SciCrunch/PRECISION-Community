# _data/papers.yml
# Paper-level metadata for the PRECISION Community landing page.
#
# Each entry represents one literature source integrated into NervoSensus.
# Fields marked "# TODO" need to be filled in from the paper or its cell-level CSV.
#
# The landing page reads this file to:
#   - render the paper summary table
#   - compute aggregate stats (total papers, total cell types, methods represented)
#   - generate cross-reference views (by method, consortium, species)
#   - link out to NervoSensus, InterLex, SPARC, and the PRECISION Dashboard

