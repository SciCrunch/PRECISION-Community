# _data/papers.yml
# Paper-level metadata for the PRECISION Community landing page.
#
# Each entry represents one literature source integrated into NervoSensus.
# Fields marked "# TODO" need to be filled in from the paper or its cell-level CSV.
#
# The landing page reads this file to:
#   - render the paper summary table
#   - compute aggregate stats (total papers, total cell types, methods represented)
#   - generate cross-reference views (by method, consortium, species)
#   - link out to NervoSensus, InterLex, SPARC, and the PRECISION Dashboard
#
# ─────────────────────────────────────────────────────────────
# TODO(InterLex API): This file is manually maintained. When InterLex
# exposes an API or structured export for npokb triples, replace this
# static file with a build step that queries InterLex and generates
# papers.yml automatically. The same API would serve NervoSensus
# (replacing sync_from_csv.py → data.js) and could feed the PRECISION
# Dashboard. The pipeline would be:
#
#   InterLex ontology (npokb triples)
#       → API / structured export
#       → build script (GitHub Actions cron or on-push)
#       → _data/papers.yml (this file, auto-generated)
#       → Jekyll rebuild → landing page updated
#
# Per-cell-type demographics (sex, age, DRG segments per cell type)
# are intentionally NOT included here — that detail belongs in
# NervoSensus and InterLex, not in a static landing page. When the
# API exists, per-cell-type tables could be generated here too, but
# the landing page's role is "directory, not database."
#
# Fields that would come from the API:
#   - cell_types_count (count of cells with this DOI as literatureCitation)
#   - species (distinct species across cells for this DOI)
#   - methods (distinct determinedByMethod values for this DOI)
#   - sex, age_range, drg_regions (aggregated from cell-level triples)
#
# Fields that stay manual (not in the ontology):
#   - links.precision_dashboard, links.dataset, links.nervosensus
# ─────────────────────────────────────────────────────────────

